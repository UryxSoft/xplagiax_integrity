[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xplagiax-integrity"
version = "0.1.0"
description = "XplagiaX Integrity: document, scientific and IP integrity assessment service (modular monolith)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
# Runtime dependencies are deliberately minimal. See docs/ARCHITECTURE.md §9.
dependencies = [
    "Flask>=3.1,<3.2",
    "SQLAlchemy>=2.0.40,<2.1",
    "alembic>=1.16,<1.17",
    "PyMySQL>=1.1,<1.2",
    # Required by PyMySQL for MySQL 8 authentication (caching_sha2_password).
    "cryptography>=46,<47",
]

[project.optional-dependencies]
server = ["gunicorn>=23,<24"]
dev = ["pytest>=8.4,<9"]

[tool.setuptools.packages.find]
include = ["integrity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:integrity.*"]
