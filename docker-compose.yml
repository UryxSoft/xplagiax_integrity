# Local development only: MySQL 8.4 (the production target) + the API.
# Qdrant, Valkey and SeaweedFS are NOT started here: they are shared XplagiaX
# infrastructure and are not used by Phase-1 code.
# NOTE: not executed in the Phase-1 session (no Docker daemon available).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: xplagiax_integrity
      MYSQL_USER: integrity
      MYSQL_PASSWORD: ${XI_DEV_DB_PASSWORD:?set XI_DEV_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20
    volumes: ["mysql-data:/var/lib/mysql"]

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app_env
      XI_ENV: development
      XI_DATABASE_URL: mysql+pymysql://integrity:${XI_DEV_DB_PASSWORD}@mysql:3306/xplagiax_integrity?charset=utf8mb4
      XI_API_KEY_PEPPER: ${XI_API_KEY_PEPPER:-}
    depends_on:
      mysql: { condition: service_healthy }

  api:
    build: .
    environment: *app_env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 256m

  worker:
    build: .
    command: ["flask", "--app", "integrity.app:create_app", "integrity", "worker", "--max-stages", "500"]
    environment: *app_env
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 512m
    restart: unless-stopped

volumes:
  mysql-data:
