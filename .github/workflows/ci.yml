name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (SQLite + MySQL 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: xi_test
          MYSQL_USER: xi
          MYSQL_PASSWORD: ci-only-not-a-secret
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # Disposable CI database; the suite wipes it before and after.
      XI_TEST_MYSQL_URL: mysql+pymysql://xi:ci-only-not-a-secret@127.0.0.1:3306/xi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Test
        # -rs prints skip reasons; the MySQL tests must NOT be skipped here.
        run: |
          python -m pytest -rs | tee pytest.out
          ! grep -q "XI_TEST_MYSQL_URL not set" pytest.out

  image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t xplagiax-integrity:ci .
      - name: Image starts and refuses unsafe configuration
        run: |
          # Production without a pepper/MySQL URL must refuse to boot.
          if docker run --rm xplagiax-integrity:ci python -c "from integrity.app import create_app; create_app()"; then
            echo "image booted with unsafe configuration" && exit 1
          fi
          docker run --rm -e XI_ENV=testing -e XI_DATABASE_URL=sqlite:// xplagiax-integrity:ci \
            python -c "from integrity.app import create_app; c=create_app().test_client(); assert c.get('/api/v1/health/live').status_code==200"
